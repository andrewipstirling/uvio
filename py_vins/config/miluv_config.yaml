verbosity: "INFO"
config: "miluv"
base_path: "/root/datasets"

# Camera Settings
max_cameras: 2
use_stereo: true
num_pts: 200 # default = 200

#  Bag settings
bag_start: 0
dataset: "1b"
robot: "ifo001"
dobag: true
bag: "ifo001_uncompressed.bag"
gt_topic: "/ifo001/vrpn_client_node/ifo001/pose"

dotime: false
dosave: false
filename_est: "uvio_twotag_localisation"
 
dolivetraj: true
path_gt: "ifo001_ground_truth.txt"
# path_gt = /root/datasets/{path_est}/{path_gt}

# UWB config names
